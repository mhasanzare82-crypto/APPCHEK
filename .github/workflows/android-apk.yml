name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['lib/**','pubspec.yaml','pubspec.lock','android/**','.github/workflows/android-apk.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.0'
          cache: true
      - run: flutter pub get
      - name: Patch file_picker for AGP 9 built-in Kotlin
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pub_cache = Path.home() / ".pub-cache/hosted/pub.dev"
          matches = list(pub_cache.glob("file_picker-*/android/build.gradle"))

          if not matches:
              raise SystemExit("ERROR: file_picker Android Gradle file not found")

          for path in matches:
              source = path.read_text()

              # AGP 9 provides Kotlin support; remove legacy Kotlin plugin declarations.
              patterns = [
                  r"""(?m)^\s*id\s*\(?\s*['"]org\.jetbrains\.kotlin\.android['"]\s*\)?\s*;?\s*\n?""",
                  r"""(?m)^\s*id\s*\(?\s*['"]kotlin-android['"]\s*\)?\s*;?\s*\n?""",
                  r"""(?m)^\s*apply\s+plugin\s*:\s*['"]org\.jetbrains\.kotlin\.android['"]\s*;?\s*\n?""",
                  r"""(?m)^\s*apply\s+plugin\s*:\s*['"]kotlin-android['"]\s*;?\s*\n?""",
              ]

              for pattern in patterns:
                  source = re.sub(pattern, "", source)

              # file_picker must declare its own compileSdk under AGP 9.
              if not re.search(r"(?m)^\s*compileSdk(?:Version)?\s+", source):
                  source, count = re.subn(
                      r"(?m)^(\s*android\s*\{)",
                      r"\1\n    compileSdk 36",
                      source,
                      count=1,
                  )
                  if count == 0:
                      raise SystemExit(f"ERROR: android {{}} block not found in {path}")

              # Fail here rather than letting Gradle fail later with a confusing error.
              remaining_plugin = re.search(
                  r"""(?m)^\s*(?:id\s*\(?\s*['"](?:org\.jetbrains\.kotlin\.android|kotlin-android)['"]|apply\s+plugin\s*:\s*['"](?:org\.jetbrains\.kotlin\.android|kotlin-android)['"])""",
                  source,
              )
              if remaining_plugin:
                  raise SystemExit(f"ERROR: Kotlin plugin declaration remains in {path}")

              if not re.search(r"(?m)^\s*compileSdk(?:Version)?\s+", source):
                  raise SystemExit(f"ERROR: compileSdk is missing in {path}")

              path.write_text(source)
              print(f"SUCCESS: Patched {path}")
          PY
      - name: Analyze Dart code
        run: flutter analyze --no-pub
      - name: Build release APK
        run: flutter build apk --release --no-pub
      - run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/APPCHEK.apk
      - uses: actions/upload-artifact@v4
        with:
          name: APPCHEK
          path: build/app/outputs/flutter-apk/APPCHEK.apk
          retention-days: 30
