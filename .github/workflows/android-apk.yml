name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['lib/**','pubspec.yaml','android/**','.github/workflows/android-apk.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: checklist-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
