name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['lib/**','pubspec.yaml','pubspec.lock','android/**','.github/workflows/android-apk.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.0'
          cache: true
      - run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze --no-pub
      - name: Build release APK
        run: flutter build apk --release --no-pub
      - run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/APPCHEK.apk
      - uses: actions/upload-artifact@v4
        with:
          name: APPCHEK
          path: build/app/outputs/flutter-apk/APPCHEK.apk
          retention-days: 30
